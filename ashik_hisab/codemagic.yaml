workflows:
  ashik-hisab-apk:
    name: Ashik Hisab APK Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Setup project
        script: |
          set -e
          if [ ! -f pubspec.yaml ] && [ -f ashik_hisab/pubspec.yaml ]; then
            cd ashik_hisab
          fi
          flutter --version
          flutter config --no-analytics

          # নতুন v2 embedding সহ অ্যান্ড্রয়েড ফোল্ডার তৈরি
          rm -rf android
          flutter create . --org com.ashik --project-name ashik_hisab --platforms android

          # অ্যাপের নাম বাংলায় 'আশিক হিসাব' সেট করা
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i.bak 's/android:label="ashik_hisab"/android:label="আশিক হিসাব"/' android/app/src/main/AndroidManifest.xml
          fi

          # compileSdk ভার্সন নিশ্চিতভাবে 36 সেট করা
          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i.bak 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle
          fi

          flutter pub get
          echo "=== Setup OK ==="
      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Build release APK
        script: |
          set -e
          if [ ! -f pubspec.yaml ] && [ -f ashik_hisab/pubspec.yaml ]; then
            cd ashik_hisab
          fi

          # বিল্ডের আগে পুনরায় compileSdk 36 ফিক্স নিশ্চিত করা
          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i.bak 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle
          fi

          flutter build apk --release

          ls -la build/app/outputs/flutter-apk/

          # রুট ফোল্ডারে APK কপি করা
          cp build/app/outputs/flutter-apk/app-release.apk ../Ashik-Hisab.apk
          ls -la ../Ashik-Hisab.apk
          echo "=== APK READY ==="
    artifacts:
      - Ashik-Hisab.apk
      - build/app/outputs/flutter-apk/*.apk
      - ashik_hisab/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ashikbd9421@gmail.com
        notify:
          success: true
          failure: true